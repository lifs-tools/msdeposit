[project]
name = "msdeposit-tools"
version = "0.1.0.dev0"
description = "Domain logic of the lifs-tools/msdeposit pipeline: mzML metadata, deposit plan, anonymisation, ISA-Tab, MAF, mzTab-M, mzQC and checks for MetaboLights depositions"
readme = "README.md"
license = "MIT"
authors = [{ name = "Nils Hoffmann" }]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "lxml>=5.3",
    "metabolights-utils==1.4.35",
    "psims>=1.4",
    "pygoslin>=2.2",
    "pymzqc==1.0.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
msdeposit-tools = "msdeposit_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msdeposit_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "external: needs external tools (Java, OPA, validation bundle) that are present in the container",
    "network: needs network access",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 120
