name: Publish the msdeposit-tools image
# Builds tools/msdeposit-tools and pushes it to ghcr.io/lifs-tools/msdeposit-tools:
#  - push to dev (tools changed): the moving tag `dev`
#  - published release: the release version, which must be the tag the modules use (e.g. 0.1.0)
#  - manual dispatch: the tag the modules use, e.g. to publish a release's image before testing the release
# The image is tested before the push (offline: the pipeline runs its tools with --network none).

on:
  push:
    branches:
      - dev
    paths:
      - "tools/msdeposit-tools/**"
      - ".github/workflows/msdeposit-tools-image.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: msdeposit-tools-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Choose the tag
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          image=ghcr.io/lifs-tools/msdeposit-tools
          used=$(grep -ho "$image:[A-Za-z0-9._-]*" modules/local/*/main.nf | sort -u)
          if [ "$(echo "$used" | wc -l)" != 1 ]; then echo "::error::modules use different tags: $used"; exit 1; fi
          case "$EVENT" in
            push) tag="$image:dev" ;;
            release)
              tag="$image:${RELEASE_TAG#v}"
              if [ "$tag" != "$used" ]; then echo "::error::release $RELEASE_TAG, but the modules use $used"; exit 1; fi ;;
            *) tag="$used" ;;
          esac
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Publishing $tag"

      - name: Build
        run: docker build -t "$TAG" tools/msdeposit-tools

      - name: Test
        run: |
          docker run --rm --network none "$TAG" msdeposit-tools --version
          docker build --target test -t msdeposit-tools:test tools/msdeposit-tools
          docker run --rm --network none msdeposit-tools:test

      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$TAG"
          docker inspect --format '{{index .RepoDigests 0}}' "$TAG"
